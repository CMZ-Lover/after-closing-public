name: Build and deploy game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test all chapters
        run: npm test
      - name: Build game
        run: npm run build
      - name: Keep downloadable game build
        uses: actions/upload-artifact@v4
        with:
          name: after-closing-web
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish playable website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show play link
        env:
          PLAY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '## 试玩网站已发布\n\n[打开惊悚游乐场](%s)\n' "$PLAY_URL" >> "$GITHUB_STEP_SUMMARY"
